[project]
name = "aaa-analyzer"
version = "0.13.1"
description = "AAA Phase 2 ML analyzer service — market regime analysis and trading signal inference"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.1",
  "pymysql>=1.1",
  "sqlalchemy>=2.0.52",
  "apscheduler>=3,<4",
  "prometheus-client>=0.26.0",
  "pandas>=3.0.5",
  "pyarrow>=25.0.1",
  "numpy>=2.5.2",
  "scikit-learn>=1.9.0",
  "lightgbm>=4.7.0",
  "xgboost>=3.4.0",
  "optuna>=4.9.0",
  "scipy>=1.18.0",
  "paramiko>=5.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.16.3",
  "pyright>=1.1.390",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
]
# PSR 컨테이너 액션(python:3.14-slim 기반) 안에는 uv가 없어 build_command가
# 실행 시점에 직접 설치한다(PSR 공식 uv_integration 가이드 패턴). Dependabot
# uv 생태계가 이 핀을 자동 갱신한다.
build = [
  "uv~=0.12.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: DB/Redis integration tests",
]
addopts = "--strict-markers --cov=analyzer --cov-report=term-missing --cov-fail-under=85"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "emoji"
major_on_zero = false
# allow_zero_version(기본 false)이 major_on_zero보다 우선 적용되어, 이 값을
# true로 두지 않으면 어떤 릴리즈 커밋이든 0.x → 1.0.0으로 강제 승격된다
# (실측: breaking 커밋 없이 0.1.0→1.0.0 오발생 확인, source: version/algorithm.py
# _increment_version — allow_zero_version 분기가 major_on_zero 분기보다 먼저 평가됨).
allow_zero_version = true
# build_command / assets 제거(SPEC-INFRA-CICD-002 M7): 둘 다 commit-back 스텝에
# uv.lock을 실어 보내기 위한 설정이었으나, release.yml이 `commit: false`로 전환되면서
# 결과물이 폐기된다 — 매 릴리스마다 uv 설치 + 재-lock CI 시간만 소모했다.
# 태그 버전은 이제 Dockerfile의 빌드타임 주입(ARG VERSION + `uv version --no-sync`)이
# 담당하므로 pyproject.toml의 version은 정적으로 남아도 무방하다.
# collector .releaserc.js의 @semantic-release/git message 컨벤션과 동일한 형식
# (gitmoji + conventional + [skip ci] — 릴리즈 커밋 자체가 Release 워크플로우를
# 재트리거하지 않도록 방지).
commit_message = "🔖 chore(release): v{version} [skip ci]"

[tool.semantic_release.commit_parser_options]
major_tags = ["breaking"]
minor_tags = ["✨", ":sparkles:"]
patch_tags = ["🐛", "⚡", ":bug:", ":zap:"]
