name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        # uv.lock 불일치 시 실패 (REQ-ANALYZER-FOUNDATION-024)
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest (integration 제외 + coverage gate)
        # integration 마커(@pytest.mark.integration)는 실 DB 접속을 요구하므로
        # CI에서 제외한다(SPEC-ANALYZER-DATA-001 M7 결정 — 옵션 b: 로컬/수동 검증
        # 의존, CI에 MySQL 서비스 컨테이너를 추가하는 운영 비용이 1인 프로젝트
        # 규모의 이득을 상회). --cov-fail-under=85는 pyproject.toml addopts에
        # 배선됨(REQ-ANALYZER-FOUNDATION-025).
        run: uv run pytest -m "not integration"

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # python-semantic-release: pyproject.toml [project.version]을 네이티브로 갱신
      # (node @semantic-release/exec + sed 우회 불요). commit_parser="emoji" 내장 파서
      # 사용, collector .releaserc.js와 동일한 gitmoji+conventional 매핑을
      # [tool.semantic_release.commit_parser_options]로 재현(✨→minor, 🐛/⚡→patch).
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e # v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "github-actions[bot]@users.noreply.github.com"
          # collector는 CHANGELOG.md를 생성하지 않음(.releaserc.js에 changelog 플러그인 미포함) — 동일하게 비활성화.
          changelog: false
