name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        # uv.lock 불일치 시 실패 (REQ-ANALYZER-FOUNDATION-024)
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest (integration 제외 + coverage gate)
        # integration 마커(@pytest.mark.integration)는 실 DB 접속을 요구하므로
        # CI에서 제외한다(SPEC-ANALYZER-DATA-001 M7 결정 — 옵션 b: 로컬/수동 검증
        # 의존, CI에 MySQL 서비스 컨테이너를 추가하는 운영 비용이 1인 프로젝트
        # 규모의 이득을 상회). --cov-fail-under=85는 pyproject.toml addopts에
        # 배선됨(REQ-ANALYZER-FOUNDATION-025).
        run: uv run pytest -m "not integration"

  # 커밋 gitmoji 게이트: python-semantic-release commit_parser="emoji"는
  # 커밋 제목 맨 앞에 등록된 gitmoji가 없으면 conventional-commit 타입
  # (feat/fix/perf)이 맞아도 "Other"로 분류해 조용히 버전 범프를 건너뛴다.
  # 실제 사고: feat(SPEC-OBSV-ANALYZER-DEADMAN-001) 커밋이 gitmoji 없이
  # main에 머지되어 "No release will be made"로 판정, Docker 빌드·NAS 배포가
  # 전혀 트리거되지 않았다(CI 전체 green, 실패 신호 없음). PR 시점에 차단해야
  # 하므로 push가 아닌 pull_request에서만 실행한다(merge 후에는 이미 늦다).
  # 순수 stdlib 스크립트라 uv sync 없이 시스템 python3만으로 충분히 빠르게
  # 독립 실패시킬 수 있다.
  commit-gitmoji-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Fetch base branch (origin/main)
        run: git fetch origin main

      - name: Check commit gitmoji vs semantic-release gate
        run: python3 scripts/check_commit_gitmoji.py origin/main..HEAD

  # PR 시점 의존성 취약점 스캔(SPEC-INFRA-PRSCAN-001): docker.yml의 Trivy 게이트와
  # 같은 액션 SHA·임계값(CRITICAL,HIGH, ignore-unfixed)으로 uv.lock의 라이브러리
  # 취약점을 PR 단계에서 차단한다. .trivyignore는 작업 디렉터리에서 자동 소비된다.
  dependency-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 입력 확인 스텝 — 이름은 "Assert"로 시작한다.
      # trivy fs는 지원 파일이 없거나 패키지가 하나도 없어도 종료 코드 0으로 끝나므로 빈 입력을 직접 막는다.
      # test -s는 uv.lock이 없거나 빈 경우를, grep은 주석뿐인 uv.lock을 잡는다.
      - name: Assert uv.lock is non-empty
        run: |
          set -euo pipefail
          test -s uv.lock
          grep -qE '^\[\[package\]\]' uv.lock

      - name: Trivy dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      # python-semantic-release: 태그만을 버전의 진실로 삼는다(SPEC-INFRA-CICD-002
      # F2/REQ-019 — commit-back 제거). commit_parser="emoji" 내장 파서 사용,
      # collector .releaserc.js와 동일한 gitmoji+conventional 매핑을
      # [tool.semantic_release.commit_parser_options]로 재현(✨→minor, 🐛/⚡→patch).
      - name: Python Semantic Release
        uses: python-semantic-release/python-semantic-release@b700dbeb1f431a0fcc30a79f3f0869407fe07278 # v10.7.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          git_committer_name: "github-actions[bot]"
          git_committer_email: "github-actions[bot]@users.noreply.github.com"
          # collector는 CHANGELOG.md를 생성하지 않음(.releaserc.js에 changelog 플러그인 미포함) — 동일하게 비활성화.
          changelog: false
          # commit-back 제거(REQ-019): pyproject.toml에 버전을 다시 커밋하지 않고
          # 태그만 생성·push한다. --no-commit --tag --push의 액션 입력 등가물.
          commit: false
          tag: true
          push: true
