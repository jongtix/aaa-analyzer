name: Docker

# Release 워크플로 완료 시 트리거
# GITHUB_TOKEN으로 생성한 태그는 다른 워크플로를 트리거하지 않으므로 (GitHub 제약)
# tags: v* 대신 workflow_run 이벤트를 사용한다
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Release 워크플로가 성공한 경우에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      # 1차 checkout: 태그 조회용 (workflow_run의 HEAD는 릴리즈 커밋 이전 시점)
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # 최신 태그 조회 + semver 검증
      # python-semantic-release가 릴리즈를 생성하지 않은 경우 (chore 커밋만 등) 빌드 스킵
      - name: Get latest tag
        id: tag
        run: |
          git fetch --tags
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No valid semver release tag found (tag='$TAG'). Skipping build."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      # 2차 checkout: 태그가 가리키는 릴리즈 커밋으로 전환
      # pyproject.toml 버전이 업데이트된 소스로 Docker 이미지를 빌드한다
      - name: Checkout release commit
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Login to GHCR
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3-tag 전략: v1.2.3 + latest + sha-xxxxx
      - name: Extract metadata
        if: ${{ steps.tag.outputs.valid == 'true' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Setup Buildx
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # 로컬 적재만 수행 (push 아님) — Trivy 스캔 통과 후에만 별도 push 스텝에서 GHCR에 반영한다
      - name: Build (local load for scan)
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CVE 게이트: CRITICAL/HIGH 발견 시 exit-code 1로 job 실패 (fail-closed, || true·continue-on-error 금지)
      # ignore-unfixed: analyzer는 시스템 유틸리티 unfixed 잔여 23건이 있어 이 플래그 없이는 게이트를 켤 수 없다 (REQ-CVE-021)
      # trivyignores 파라미터는 명시하지 않는다 — 명시 시 파일 부재가 에러가 되므로,
      # 레포 루트 .trivyignore를 trivy 기본 동작(있으면 자동 적용, 없으면 무시)에 맡긴다 (REQ-CVE-017)
      - name: Trivy CVE scan
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
