name: Docker

# 태그 push 트리거 (SPEC-INFRA-CICD-002 M5/F1/REQ-017/018).
# App 토큰(SPEC-INFRA-CICD-002 M3)이 push한 태그는 workflow_run과 달리
# push:tags 이벤트를 실제로 발화한다 — GITHUB_TOKEN push는 발화하지 않는다.
on:
  push:
    tags:
      - 'v*'

permissions: {}  # 워크플로 전체 기본 권한 차단, job별 최소 권한 선언

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 태그 push 이벤트이므로 checkout 시점의 커밋이 이미 릴리스 커밋이다.
      # workflow_run 시절의 1차(태그 탐색)/2차(재체크아웃) checkout이 불필요해졌다.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # github.ref_name이 곧 push된 태그 이름이므로 git 명령 없이 바로 도출한다.
      - name: Derive version from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected tag format (tag='$TAG'). Skipping build."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

      # 게이트 정책 분리: 빌드 소스는 릴리스 태그 트리(재현성), 예외 정책(.trivyignore)은
      # 항상 main HEAD를 본다 — 예외 등록·만료 갱신이 릴리스 없이 즉시 게이트에 반영된다
      # (SPEC-INFRA-CVE-SCAN-001 v0.8.1 REQ-CVE-016/017 운영 구조).
      - name: Overlay .trivyignore from main
        if: ${{ steps.tag.outputs.valid == 'true' }}
        run: |
          git fetch origin main --depth=1
          git checkout FETCH_HEAD -- .trivyignore || echo "no .trivyignore on main — scan runs without exceptions"

      - name: Login to GHCR
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3-tag 전략: v1.2.3 + latest + sha-xxxxx
      - name: Extract metadata
        if: ${{ steps.tag.outputs.valid == 'true' }}
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Setup Buildx
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # 로컬 적재만 수행 (push 아님) — Trivy 스캔 통과 후에만 별도 push 스텝에서 GHCR에 반영한다
      - name: Build (local load for scan)
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CVE 게이트: CRITICAL/HIGH 발견 시 exit-code 1로 job 실패 (fail-closed, || true·continue-on-error 금지)
      # ignore-unfixed: analyzer는 시스템 유틸리티 unfixed 잔여 23건이 있어 이 플래그 없이는 게이트를 켤 수 없다 (REQ-CVE-021)
      # trivyignores 파라미터는 명시하지 않는다 — 명시 시 파일 부재가 에러가 되므로,
      # 레포 루트 .trivyignore를 trivy 기본 동작(있으면 자동 적용, 없으면 무시)에 맡긴다 (REQ-CVE-017)
      - name: Trivy CVE scan
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          scanners: vuln
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

      - name: Push
        if: ${{ steps.tag.outputs.valid == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
